spring:
  application:
    name: eureka-server
  cloud:
    loadbalancer:
      cache:
        enabled: false

# cloud.loadbalancer.cache.enabled: false параметр
# отключает локальный кэш в диспетчере нагрузки (LoadBalancer).
# Вот как это работает:
# С включенным кэшем (по умолчанию true):
# Когда ваш сервис (например  Students) запрашивает у Eureka адрес LIBRARY,
# он сохраняет этот адрес у себя в памяти на некоторое время (обычно на 30 секунд).
# Если в этот момент вы запустите второй экземпляр LIBRARY или выключите первый,
# ваш сервис об этом не узнает сразу — он будет использовать старый список из кэша.
# С выключенным кэшем (false):
# Сервис при каждом запросе будет обращаться к внутренним механизмам Discovery Client,
# чтобы получить максимально свежий список адресов.
# Зачем мы его отключаем в процессе разработки?
# Мгновенная реакция: Когда вы в IDEA останавливаете один сервис
# и запускаете другой, вам хочется сразу проверить результат.
# Если кэш включен, вы можете 30 секунд получать ошибку «Instance not found»,
# хотя в Eureka сервис уже виден как UP.
# Тестирование балансировки: Чтобы четко видеть, как запросы прыгают
# между портами 8082 и 8083 без задержек на обновление памяти.
# Стоит ли это делать в реальном проекте (Production)?
# Нет. В реальной работе кэш обязательно должен быть включен.
# Если его выключить, то на каждый ваш запрос будет тратиться
# лишнее время и ресурсы на пересчет списка доступных
# адресов, что снизит производительность всей системы.

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

